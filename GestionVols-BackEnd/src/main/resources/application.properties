spring.application.name=vols
server.port=8090
# Toutes les urls commencent par http://localhost:8090/vols
server.servlet.context-path=/vols

# ---- MySQL (la base est créée automatiquement si elle n'existe pas) ----
spring.datasource.url=jdbc:mysql://localhost:3306/vols_db?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Spring Data REST : nombre d'éléments par page (par défaut 20)
spring.data.rest.default-page-size=100
